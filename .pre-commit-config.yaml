repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-toml
      - id: check-yaml
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.9
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        files: '\.py$'
      - id: ruff-format
        files: '\.py$'

  - repo: https://github.com/adamchainz/blacken-docs
    rev: 1.19.1
    hooks:
      - id: blacken-docs
        additional_dependencies: [black==24.10.0]
        args: [-l, '79', -t, py312]
        files: '\.py$'

  - repo: https://github.com/nbQA-dev/nbQA
    rev: 1.7.0
    hooks:
      - id: nbqa-black
        name: nbQA Black
        entry: nbqa black
        language: system
        types: [jupyter]
      - id: nbqa-ruff
        name: nbQA Ruff
        entry: nbqa ruff
        language: system
        args: [--fix]
        types: [jupyter]

