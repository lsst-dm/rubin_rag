description: Confluence spaces to ingest into Rubin_RAG

chunking:
  strategy: recursive_character
  params:
    chunk_size: 1000
    chunk_overlap: 50

wikis:
  - url: "https://rubinobs.atlassian.net/wiki"
    spaces:
      - space: "SP"
      - space: "DM"
      - space: "EPO"
      - space: "SYSENG"
      - space: "CAM"
      - space: "COM"
      - space: "LTSAD"
      - space: "OLM"
      - space: "LTS"
      - space: "LSSTPO"
      - space: "CMMS"
      - space: "OST"
      - space: "IT"
      - space: "LSSTCOM"
      - space: "SIM"
      - space: "LSP"
      - space: "PS"
      - space: "PC"
      - space: "OOD"
      - space: "RM"
      - space: "LSCO"
      # LWDPP only has 2 child pages -- this format is used to test the code
      # The space default page does not have a page ID.
      - space: "LWDPP"
        pages:
          - page_id: "42270754"
          - page_id: "42270746"
      - space: "IM"
      - space: "LSSTOps"

