    - name: "Rubin DP0.2"
      url: "https://github.com/lsst/tutorial-notebooks/tree/main/DP0.2"
      description: "Rubin DP0.2 tutorials"
- title: "lsst-rsp"
  url: "https://github.com/lsst-sqre/lsst-rsp"
  description: "User-facing classes and functions for RSP Python code"
  category: "rsp"

