# Confluence data sources -- template
#title: The name of the github repo.
#url: The URL to the github repo.
#description: A short description of the repo.
#category: Categorized as e.g. pipelines, rsp, tutorial
- title: "meas_base"
  url: "https://github.com/lsst/meas_base"
  description: "The lsst.meas.base Python module provides core astronomical measurement algorithms and base classes. Documentation is available at https://pipelines.lsst.io/modules/lsst.meas.base/index.html ."
  category: "pipelines"
- title: "tutorial-notebooks"
  url: "https://github.com/lsst/tutorial-notebooks"
  description: "Tutorial Jupyter Notebooks maintained by the Rubin Observatory Community Science Team."
  category: "documentation"
